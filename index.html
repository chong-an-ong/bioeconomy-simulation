<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Bioeconomy Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">

    <div class="goal">
      <div class="eyebrow">SIMULATION GOAL</div>

      <h1>
        To negotiate an
        <button class="concept-link" data-concept="international">international</button>
        <button class="concept-link" data-concept="bioeconomy">bioeconomy</button>
        <button class="concept-link" data-concept="framework">framework</button>
      </h1>

      <div class="country-selector-area">

<div class="country-selector-hint">
  COUNTRIES
</div>

  <nav
    id="countrySelector"
    class="country-selector"
    aria-label="Simulation countries">
  </nav>

</div>
    </div>

<div class="utility-panel">

  <button
    id="treatyHubBtn"
    class="utility-button">
    Treaty Hub
  </button>

  <button
    id="actorAssignmentsBtn"
    class="utility-button">
    Actor Assignments
  </button>

  <button
    id="timelineBtn"
    class="utility-button">
    Timeline
  </button>

  <button
    id="rulesBtn"
    class="utility-button">
    Rules &amp; Norms
  </button>

  <div class="chair-display">

    <div class="chair-label">
      CHAIR
    </div>

    <div
      id="chairDisplay"
      class="chair-name">

      Not yet elected

    </div>

  </div>

</div>

  </header>


<!-- LEFT SIMULATION TOOLBAR -->

<div class="simulation-toolbar">

  <div class="toolbar-section">

  <div class="toolbar-heading">
    SECTORS
  </div>

  <button
    class="coalition-button"
    data-filter-type="sector"
    data-filter-value="Agriculture & food">
    Agriculture & food
  </button>

  <button
    class="coalition-button"
    data-filter-type="sector"
    data-filter-value="Forestry & forest products">
    Forestry & forest products
  </button>

  <button
    class="coalition-button"
    data-filter-type="sector"
    data-filter-value="Bio-based materials & chemicals">
    Bio-based materials & chemicals
  </button>

  <button
    class="coalition-button"
    data-filter-type="sector"
    data-filter-value="Bioenergy & fuels">
    Bioenergy & fuels
  </button>

  <button
    class="coalition-button"
    data-filter-type="sector"
    data-filter-value="Cross-cutting">
    Cross-cutting
  </button>

</div>

<div class="toolbar-section">

  <div class="toolbar-heading">
    CONSTITUENCIES
  </div>

  <button
    class="coalition-button"
    data-filter-type="constituency"
    data-filter-value="Industry">
    Industry
  </button>

  <button
    class="coalition-button"
    data-filter-type="constituency"
    data-filter-value="Indigenous peoples">
    Indigenous peoples
  </button>

  <button
    class="coalition-button"
    data-filter-type="constituency"
    data-filter-value="Farmers & workers">
    Farmers & workers
  </button>

</div>

</div>


  <!-- WORLD MAP -->

  <main class="map-wrap">

    <div id="worldMap" class="world-map"></div>

  </main>


  <!-- MODAL / OVERLAY -->

  <div id="overlay" class="overlay hidden">

    <section
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true">

      <button
        id="closeModal"
        class="close"
        aria-label="Close">
        ×
      </button>

      <div id="modalContent"></div>

    </section>

  </div>


  <script src="script.js"></script>

</body>
</html>
