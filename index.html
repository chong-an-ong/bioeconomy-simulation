<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Bioeconomy Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">

    <div class="goal">
      <div class="eyebrow">SIMULATION GOAL</div>

      <h1>
        To negotiate an
        <button class="concept-link" data-concept="international">international</button>
        <button class="concept-link" data-concept="bioeconomy">bioeconomy</button>
        <button class="concept-link" data-concept="framework">framework</button>
      </h1>

      <div class="country-selector-area">

<div class="country-selector-hint">
  COUNTRIES
</div>

  <nav
    id="countrySelector"
    class="country-selector"
    aria-label="Simulation countries">
  </nav>

</div>
    </div>

<div class="utility-panel">

  <button
    id="treatyHubBtn"
    class="utility-button">
    Treaty Hub
  </button>

  <button
    id="actorAssignmentsBtn"
    class="utility-button">
    Actor Assignments
  </button>

  <button
    id="timelineBtn"
    class="utility-button">
    Timeline
  </button>

  <button
    id="rulesBtn"
    class="utility-button">
    Rules &amp; Norms
  </button>

  <div class="chair-display">

    <div class="chair-label">
      CHAIR
    </div>

    <div
      id="chairDisplay"
      class="chair-name">

      Not yet elected

    </div>

  </div>

</div>

  </header>


  <!-- LEFT SIMULATION TOOLBAR -->

  <div class="simulation-toolbar">

    <div class="toolbar-section">

      <div class="toolbar-heading">
        SECTORS
      </div>

      <button
        class="coalition-button"
        data-filter-type="sector"
        data-filter-value="Fibers / Textiles">
        Fibers / Textiles
      </button>

      <button
        class="coalition-button"
        data-filter-type="sector"
        data-filter-value="Marine">
        Marine
      </button>

      <button
        class="coalition-button"
        data-filter-type="sector"
        data-filter-value="Forestry / Timber">
        Forestry / Timber
      </button>

      <button
        class="coalition-button"
        data-filter-type="sector"
        data-filter-value="Agriculture">
        Agriculture
      </button>

      <button
        class="coalition-button"
        data-filter-type="sector"
        data-filter-value="Bio-based Chemicals">
        Bio-based Chemicals
      </button>

    </div>


    <div class="toolbar-section">

      <div class="toolbar-heading">
        CONSTITUENCIES
      </div>

      <button
        class="coalition-button"
        data-filter-type="constituency"
        data-filter-value="Indigenous">
        Indigenous
      </button>

      <button
        class="coalition-button"
        data-filter-type="constituency"
        data-filter-value="NGOs">
        NGOs
      </button>

    </div>

  </div>


  <!-- WORLD MAP -->

  <main class="map-wrap">

    <div id="worldMap" class="world-map"></div>

  </main>


  <!-- MODAL / OVERLAY -->

  <div id="overlay" class="overlay hidden">

    <section
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true">

      <button
        id="closeModal"
        class="close"
        aria-label="Close">
        ×
      </button>

      <div id="modalContent"></div>

    </section>

  </div>


  <script src="script.js"></script>

</body>
</html>
