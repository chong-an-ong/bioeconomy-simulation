<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Bioeconomy Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="goal">
      <div class="eyebrow">SIMULATION GOAL</div>
      <h1>To negotiate an
        <button class="concept-link" data-concept="international">international</button>
        <button class="concept-link" data-concept="bioeconomy">bioeconomy</button>
        <button class="concept-link" data-concept="framework">framework</button>
      </h1>
    </div>
    <button id="treatyHubBtn" class="utility-button">Treaty Hub</button>
  </header>

  <main class="map-wrap">
  <div class="map-hint">Select a country</div>
  <div id="worldMap" class="world-map"></div>
</main>

  <div id="overlay" class="overlay hidden">
    <section id="modal" class="modal" role="dialog" aria-modal="true">
      <button id="closeModal" class="close" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
